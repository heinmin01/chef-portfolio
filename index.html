<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julien Marceau | Executive Chef</title>
<meta name="description" content="Julien Marceau is an executive chef cooking fine dining rooted in French technique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FAF7F0;
    --sand: #F1ECE0;
    --stone: #E2DAC8;
    --ink: #2B2A26;
    --muted: #6B6A62;
    --bronze: #8A6B2F;
    --line: #DDD5C2;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
    --max: 1040px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--sans); line-height: 1.7; font-size: 16px; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }
  section { padding: 96px 0; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.15; }
  h2 { font-size: clamp(30px, 4vw, 42px); margin-bottom: 14px; }
  .label { color: var(--bronze); font-size: 14px; margin-bottom: 12px; display: block; }
  .muted { color: var(--muted); }

  header { position: sticky; top: 0; z-index: 10; background: rgba(250,247,240,.94); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .brand { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  nav { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  nav a:hover { color: var(--ink); }

  .hero { text-align: center; padding: 140px 0 130px; }
  .hero h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 500; margin: 8px 0 20px; }
  .hero p { color: var(--muted); font-size: 18px; max-width: 460px; margin: 0 auto 36px; }

  .btn { display: inline-block; padding: 13px 32px; font-size: 15px; border: 1px solid var(--ink); border-radius: 2px; transition: background .2s, color .2s; cursor: pointer; font-family: var(--sans); background: transparent; color: var(--ink); }
  .btn:hover { background: var(--ink); color: var(--ivory); }
  .btn.solid { background: var(--ink); color: var(--ivory); }
  .btn.solid:hover { background: var(--bronze); border-color: var(--bronze); }

  .about { background: var(--sand); }
  .about .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo { background: var(--stone); aspect-ratio: 4 / 5; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #8A8474; font-size: 14px; }
  .about p { color: var(--muted); max-width: 46ch; }
  .about p + p { margin-top: 14px; }

  .dishes-head { text-align: center; margin-bottom: 48px; }
  .dishes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
  .dish .photo { aspect-ratio: 1 / 1; margin-bottom: 16px; background: #E9E2D2; }
  .dish h3 { font-size: 24px; }
  .dish p { color: var(--muted); font-size: 15px; }

  .journey { background: var(--sand); }
  .journey h2 { text-align: center; margin-bottom: 44px; }
  .timeline { max-width: 560px; margin: 0 auto; }
  .row { display: grid; grid-template-columns: 72px 1fr; gap: 24px; }
  .row .year { text-align: right; color: var(--bronze); font-family: var(--serif); font-size: 22px; line-height: 1.3; }
  .row .body { border-left: 1px solid #CFC6B0; padding: 0 0 32px 24px; }
  .row:last-child .body { padding-bottom: 0; }
  .row h3 { font-size: 22px; }
  .row p { color: var(--muted); font-size: 15px; }

  .contact { text-align: center; }
  .contact p.lead { color: var(--muted); max-width: 44ch; margin: 0 auto 36px; }
  form { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; text-align: left; }
  label { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
  input, textarea, select { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); background: #fff; border-radius: 2px; color: var(--ink); width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  form .btn { justify-self: start; margin-top: 6px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0; font-size: 14px; color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 760px) {
    section { padding: 68px 0; }
    nav { gap: 18px; }
    .brand { font-size: 19px; }
    .hero { padding: 90px 0; }
    .about .wrap { grid-template-columns: 1fr; gap: 32px; }
    .dishes { grid-template-columns: 1fr; }
    .row { grid-template-columns: 56px 1fr; gap: 16px; }
  }
  @media (max-width: 480px) { nav a:nth-child(2) { display: none; } }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="#top" class="brand" data-t="name"></a>
    <nav aria-label="Main">
      <a href="#about">About</a>
      <a href="#dishes">Dishes</a>
      <a href="#journey">Journey</a>
      <a href="#reserve">Reserve</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero"><div class="wrap">
    <span class="label" data-t="hero.label"></span>
    <h1 data-t="hero.title"></h1>
    <p data-t="hero.text"></p>
    <a href="#reserve" class="btn" data-t="hero.button"></a>
  </div></section>

  <section class="about" id="about"><div class="wrap">
    <div id="about-photo"></div>
    <div>
      <span class="label" data-t="about.label"></span>
      <h2 data-t="about.title"></h2>
      <div id="about-body"></div>
    </div>
  </div></section>

  <section id="dishes"><div class="wrap">
    <div class="dishes-head">
      <span class="label" data-t="dishes.label"></span>
      <h2 data-t="dishes.title"></h2>
    </div>
    <div class="dishes" id="dish-list"></div>
  </div></section>

  <section class="journey" id="journey"><div class="wrap">
    <h2 data-t="journey.title"></h2>
    <div class="timeline" id="timeline"></div>
  </div></section>

  <section class="contact" id="reserve"><div class="wrap">
    <span class="label" data-t="contact.label"></span>
    <h2 data-t="contact.title"></h2>
    <p class="lead" data-t="contact.text"></p>
    <form id="contact-form" method="post" enctype="text/plain">
      <label>Your name <input type="text" name="name" autocomplete="name" required></label>
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
      <label>What's the occasion?
        <select name="occasion">
          <option>Private dinner</option><option>Event or catering</option>
          <option>Collaboration</option><option>Something else</option>
        </select>
      </label>
      <label>Message <textarea name="message"></textarea></label>
      <button class="btn solid" type="submit">Send request</button>
    </form>
  </div></section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> <span data-t="name"></span></span>
    <span><a id="ig" href="#">Instagram</a> &nbsp;&nbsp; <a id="mail" href="#"></a></span>
  </div>
</footer>

<script>
fetch("content/site.json").then(function (r) { return r.json(); }).then(function (c) {
  function get(path) { return path.split(".").reduce(function (o, k) { return o && o[k]; }, c) || ""; }
  document.querySelectorAll("[data-t]").forEach(function (el) {
    var lines = String(get(el.dataset.t)).split("\n");
    el.textContent = "";
    lines.forEach(function (line, i) {
      if (i) el.appendChild(document.createElement("br"));
      el.appendChild(document.createTextNode(line));
    });
  });
  document.title = c.name + " | " + c.hero.label;
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.content = c.description;
  function photo(src, alt, label) {
    var d = document.createElement("div");
    d.className = "photo";
    if (src) { var i = document.createElement("img"); i.src = src; i.alt = alt; i.loading = "lazy"; d.appendChild(i); }
    else { d.textContent = label; d.setAttribute("role", "img"); d.setAttribute("aria-label", alt + " (placeholder)"); }
    return d;
  }
  function el(tag, text, cls) { var e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; }
  document.getElementById("about-photo").replaceWith(photo(c.about.photo, "Portrait of " + c.name, "Portrait photo"));
  var body = document.getElementById("about-body");
  c.about.body.split(/\n\s*\n/).forEach(function (t) { body.appendChild(el("p", t.trim())); });
  var list = document.getElementById("dish-list");
  c.dishes.items.forEach(function (d) {
    var a = document.createElement("article"); a.className = "dish";
    a.appendChild(photo(d.photo, d.name, "Photo"));
    a.appendChild(el("h3", d.name)); a.appendChild(el("p", d.description));
    list.appendChild(a);
  });
  var tl = document.getElementById("timeline");
  c.journey.items.forEach(function (j) {
    var r = document.createElement("div"); r.className = "row";
    r.appendChild(el("div", j.year, "year"));
    var b = document.createElement("div"); b.className = "body";
    b.appendChild(el("h3", j.role)); b.appendChild(el("p", j.place));
    r.appendChild(b); tl.appendChild(r);
  });
  document.getElementById("contact-form").action = "mailto:" + c.email;
  document.getElementById("ig").href = c.instagram;
  var m = document.getElementById("mail"); m.href = "mailto:" + c.email; m.textContent = c.email;
  document.getElementById("year").textContent = new Date().getFullYear();
});
</script>
</body>
</html>
